<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PURBLE PLACE</title>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;1,400;1,500&family=Space+Mono:wght@400;700&family=Noto+Serif+SC:wght@300;400&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#ede8f5;
  --dark:#1a1020;
  --muted:#7a6e8a;
  --accent:#c9a8e8;
  --pink:#e87ab3;
}
html,body{width:100%;height:100%;overflow:hidden}
body{
  background:var(--bg);
  color:var(--dark);
  font-family:'EB Garamond',serif;
  cursor:none;
  position:relative;
}

/* grain overlay */
body::before{
  content:'';
  position:fixed;inset:0;
  background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.04'/%3E%3C/svg%3E");
  pointer-events:none;z-index:0;opacity:0.6;
}

/* cursor */
#cursor{
  position:fixed;top:0;left:0;pointer-events:none;z-index:9999;
  width:12px;height:12px;border-radius:50%;
  background:var(--pink);
  transform:translate(-50%,-50%);
  transition:transform 0.15s ease,width 0.2s,height 0.2s,opacity 0.2s;
  mix-blend-mode:multiply;
}
#cursor-ring{
  position:fixed;top:0;left:0;pointer-events:none;z-index:9998;
  width:36px;height:36px;border-radius:50%;
  border:1px solid var(--accent);
  transform:translate(-50%,-50%);
  transition:transform 0.08s ease,width 0.3s,height 0.3s,opacity 0.3s;
  opacity:0.6;
}
body:has(a:hover) #cursor{width:20px;height:20px;opacity:0.7}
body:has(a:hover) #cursor-ring{width:60px;height:60px;opacity:0.3}

/* mouse-follow orb */
#orb{
  position:fixed;pointer-events:none;z-index:1;
  width:320px;height:320px;border-radius:50%;
  background:radial-gradient(circle,rgba(201,168,232,0.18) 0%,transparent 70%);
  transform:translate(-50%,-50%);
  transition:left 0.8s cubic-bezier(0.23,1,0.32,1),top 0.8s cubic-bezier(0.23,1,0.32,1);
}

/* main layout */
main{
  position:relative;z-index:2;
  width:100%;height:100vh;
  display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  gap:0;
}

/* title block */
.title-block{text-align:center;position:relative}

.pp-glyph{
  font-size:clamp(60px,10vw,140px);
  line-height:1;
  letter-spacing:-0.02em;
  color:var(--dark);
  opacity:0.12;
  font-family:'Space Mono',monospace;
  font-weight:700;
  position:absolute;
  top:50%;left:50%;
  transform:translate(-50%,-58%);
  pointer-events:none;
  user-select:none;
  white-space:nowrap;
}

.main-title{
  font-family:'EB Garamond',serif;
  font-size:clamp(2.5rem,7vw,7rem);
  font-weight:400;
  letter-spacing:0.25em;
  line-height:1;
  position:relative;z-index:2;
}

.main-subtitle{
  font-family:'Space Mono',monospace;
  font-size:clamp(8px,1vw,11px);
  letter-spacing:0.3em;
  color:var(--muted);
  text-transform:uppercase;
  margin-top:1.2rem;
}

.time-blink{
  font-family:'Space Mono',monospace;
  font-size:clamp(1rem,2vw,1.6rem);
  font-weight:700;
  color:var(--accent);
  letter-spacing:0.15em;
  margin-top:2.5rem;
  animation:blink 2.4s ease-in-out infinite;
}
@keyframes blink{0%,100%{opacity:1}50%{opacity:0.25}}

.tagline{
  font-family:'EB Garamond',serif;
  font-style:italic;
  font-size:clamp(0.9rem,1.5vw,1.2rem);
  color:var(--muted);
  margin-top:1.2rem;
  letter-spacing:0.05em;
}

/* decorative circles */
.dec-circle{
  position:fixed;border-radius:50%;
  border:1px solid rgba(201,168,232,0.25);
  pointer-events:none;z-index:1;
  animation:rotate-slow linear infinite;
}
@keyframes rotate-slow{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}

/* bottom nav */
nav.bottom-nav{
  position:fixed;bottom:0;left:0;right:0;z-index:10;
  display:flex;align-items:center;justify-content:center;
  padding:0 0 2.5rem;
  gap:clamp(1.5rem,4vw,4rem);
}
.nav-item{
  display:flex;flex-direction:column;align-items:center;gap:0.5rem;
  text-decoration:none;
  cursor:none;
  position:relative;
}
.nav-item-label{
  font-family:'Space Mono',monospace;
  font-size:9px;
  letter-spacing:0.25em;
  text-transform:uppercase;
  color:var(--muted);
  transition:color 0.25s;
}
.nav-item-zh{
  font-family:'Noto Serif SC',serif;
  font-size:clamp(0.85rem,1.5vw,1.1rem);
  font-weight:300;
  color:var(--dark);
  transition:color 0.25s,transform 0.3s;
  letter-spacing:0.1em;
}
.nav-item::after{
  content:'';
  position:absolute;bottom:-8px;left:50%;transform:translateX(-50%);
  width:3px;height:3px;border-radius:50%;
  background:var(--accent);
  opacity:0;transition:opacity 0.25s;
}
.nav-item:hover .nav-item-label{color:var(--dark)}
.nav-item:hover .nav-item-zh{color:var(--pink);transform:translateY(-3px)}
.nav-item:hover::after{opacity:1}

/* top corner */
.corner-mark{
  position:fixed;top:2rem;left:2.5rem;z-index:10;
  font-family:'Space Mono',monospace;
  font-size:9px;letter-spacing:0.2em;
  color:var(--muted);text-transform:uppercase;
  opacity:0.7;
}
.corner-year{
  position:fixed;top:2rem;right:2.5rem;z-index:10;
  font-family:'Space Mono',monospace;
  font-size:9px;letter-spacing:0.2em;
  color:var(--muted);text-transform:uppercase;
  opacity:0.7;
}

/* page-in animation */
@keyframes fadeUp{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:translateY(0)}}
.main-title{animation:fadeUp 1s ease 0.2s both}
.main-subtitle{animation:fadeUp 1s ease 0.5s both}
.time-blink{animation-name:blink,fadeUp2;animation-duration:2.4s,0.8s;animation-timing-function:ease-in-out,ease;animation-delay:0s,0.7s;animation-fill-mode:none,both;animation-iteration-count:infinite,1}
@keyframes fadeUp2{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
.tagline{animation:fadeUp 1s ease 0.9s both}
nav.bottom-nav{animation:fadeUp 1s ease 1.1s both}
</style>
</head>
<body>

<div id="cursor"></div>
<div id="cursor-ring"></div>
<div id="orb"></div>

<div class="corner-mark">Purble Place</div>
<div class="corner-year">feztg · 2026</div>

<!-- decorative circles -->
<div class="dec-circle" style="width:480px;height:480px;top:-80px;right:-120px;animation-duration:35s"></div>
<div class="dec-circle" style="width:220px;height:220px;bottom:80px;left:-60px;animation-duration:22s;animation-direction:reverse"></div>
<div class="dec-circle" style="width:90px;height:90px;top:30%;left:10%;animation-duration:16s"></div>
<div class="dec-circle" style="width:50px;height:50px;bottom:25%;right:12%;animation-duration:13s;animation-direction:reverse"></div>

<main>
  <div class="title-block">
    <div class="pp-glyph">PP</div>
    <h1 class="main-title">PURBLE PLACE</h1>
    <p class="main-subtitle">普尔布尔乐园 · Final Version · by tonge</p>
    <div class="time-blink">12 : 20</div>
    <p class="tagline">i saw you — will you look back?</p>
  </div>
</main>

<nav class="bottom-nav">
  <a class="nav-item" href="about.html">
    <span class="nav-item-label">01</span>
    <span class="nav-item-zh">关于</span>
  </a>
  <a class="nav-item" href="characters.html">
    <span class="nav-item-label">02</span>
    <span class="nav-item-zh">人物</span>
  </a>
  <a class="nav-item" href="memories.html">
    <span class="nav-item-label">03</span>
    <span class="nav-item-zh">记忆墙</span>
  </a>
  <a class="nav-item" href="gallery.html">
    <span class="nav-item-label">04</span>
    <span class="nav-item-zh">相册</span>
  </a>
</nav>

<script>

const cursor=document.getElementById('cursor');
const ring=document.getElementById('cursor-ring');

document.addEventListener('mousemove',e=>{

  cursor.style.left=mx+'px';cursor.style.top=my+'px';
  ring.style.left=mx+'px';ring.style.top=my+'px';
  orb.style.left=mx+'px';orb.style.top=my+'px';
});

document.addEventListener('mousedown',()=>{cursor.style.transform='translate(-50%,-50%) scale(0.6)';});
document.addEventListener('mouseup',()=>{cursor.style.transform='translate(-50%,-50%) scale(1)';});

document.querySelectorAll('a').forEach(a=>{
  a.addEventListener('click',e=>{
    e.preventDefault();
    const href=a.href;
    document.body.style.transition='opacity 0.35s ease';

    setTimeout(()=>location.href=href,350);

</script>
</body>
</html>
